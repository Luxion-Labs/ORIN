<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="orin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070C" />
      <stop offset="50%" stop-color="#0E121D" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>
    <linearGradient id="indigo-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <radialGradient id="notion-glow" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#05070C" stop-opacity="0" />
    </radialGradient>
    <pattern id="notion-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#6366F1" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#orin-bg)" />
  <rect width="1200" height="420" fill="url(#notion-glow)" />
  <rect width="1200" height="420" fill="url(#notion-grid)" />

  <rect x="20" y="20" width="1160" height="380" rx="14" fill="none" stroke="#6366F1" stroke-width="1" stroke-opacity="0.2" />

  <!-- Notion MCP Context Graph Art (Right Side) -->
  <g transform="translate(850, 210)">
    <!-- Central MCP Knowledge Core -->
    <circle cx="0" cy="0" r="42" fill="#121829" stroke="#6366F1" stroke-width="2.5" />
    <circle cx="0" cy="0" r="24" fill="#6366F1" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1.5" />
    <!-- Stylized Notion 'N' Geometric Block -->
    <rect x="-10" y="-12" width="20" height="24" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <line x1="-5" y1="-6" x2="5" y2="6" stroke="#FFFFFF" stroke-width="2" />

    <!-- Connecting Protocol Vectors -->
    <path d="M 0 -42 L -80 -100 M 0 -42 L 80 -100 M 0 42 L -90 90 M 0 42 L 90 90" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4 4" />

    <!-- Context Satellite 1: Notion Pages (Top Left) -->
    <g transform="translate(-80, -100)">
      <rect x="-45" y="-22" width="90" height="44" rx="6" fill="#151C30" stroke="#06B6D4" stroke-width="1.5" />
      <text x="0" y="4" fill="#06B6D4" font-family="'SF Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">DOCS/PAGES</text>
    </g>
    <!-- Context Satellite 2: Databases (Top Right) -->
    <g transform="translate(80, -100)">
      <rect x="-45" y="-22" width="90" height="44" rx="6" fill="#151C30" stroke="#8B5CF6" stroke-width="1.5" />
      <text x="0" y="4" fill="#8B5CF6" font-family="'SF Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">DATABASES</text>
    </g>
    <!-- Context Satellite 3: Gemini Synthesis (Bottom Left) -->
    <g transform="translate(-90, 90)">
      <rect x="-45" y="-22" width="90" height="44" rx="6" fill="#151C30" stroke="#10B981" stroke-width="1.5" />
      <text x="0" y="4" fill="#10B981" font-family="'SF Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">GEMINI AI</text>
    </g>
    <!-- Context Satellite 4: MCP Tools (Bottom Right) -->
    <g transform="translate(90, 90)">
      <rect x="-45" y="-22" width="90" height="44" rx="6" fill="#151C30" stroke="#F59E0B" stroke-width="1.5" />
      <text x="0" y="4" fill="#F59E0B" font-family="'SF Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MCP TOOLS</text>
    </g>

    <text x="0" y="150" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11" letter-spacing="1" text-anchor="middle">CONTEXT BUS: REAL-TIME PIPELINE</text>
  </g>

  <!-- Content (Left Side) -->
  <g transform="translate(70, 75)">
    <rect width="240" height="30" rx="15" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4" fill="#6366F1" />
    <text x="28" y="19" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">CONTEXT OPERATING SYSTEM</text>

    <text x="0" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      ORIN
    </text>

    <rect x="0" y="105" width="85" height="4" rx="2" fill="url(#indigo-cyan)" />

    <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2">
      Context Operating System powered by Notion MCP and Gemini AI for knowledge synthesis.
    </text>

    <text x="0" y="180" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Bridges your private Notion workspace directly into LLM reasoning loops with zero friction.
    </text>

    <g transform="translate(0, 240)">
      <rect width="170" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="14" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">PROTOCOL: NOTION MCP</text>

      <rect x="185" y="0" width="180" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="199" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">MODEL: GOOGLE GEMINI</text>

      <rect x="380" y="0" width="160" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="394" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SLA: 24H RESPONSE</text>
    </g>
  </g>
</svg>